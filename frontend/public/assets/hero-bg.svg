<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="rg1" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg2" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg3" cx="90%" cy="90%" r="40%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  <!-- Dark navy base -->
  <rect width="1440" height="600" fill="#0f172a"/>
  <!-- Abstract fluid shapes -->
  <ellipse cx="1100" cy="150" rx="380" ry="280" fill="#2563eb" filter="url(#blur2)" opacity="0.55"/>
  <ellipse cx="1200" cy="400" rx="300" ry="220" fill="#3b82f6" filter="url(#blur2)" opacity="0.45"/>
  <ellipse cx="900" cy="50" rx="250" ry="180" fill="#1d4ed8" filter="url(#blur1)" opacity="0.6"/>
  <ellipse cx="1350" cy="250" rx="200" ry="250" fill="#60a5fa" filter="url(#blur2)" opacity="0.35"/>
  <ellipse cx="200" cy="500" rx="280" ry="180" fill="#1e40af" filter="url(#blur2)" opacity="0.3"/>
  <!-- Fluid ribbon shapes (mimicking the abstract 3D ribbon from screenshot) -->
  <path d="M 900 -50 C 980 50 870 150 950 250 C 1030 350 920 420 1000 520 C 1080 620 1200 580 1280 480 C 1360 380 1300 200 1380 100 C 1440 20 1440 -20 1440 -50 Z" fill="#3b82f6" opacity="0.25" filter="url(#blur1)"/>
  <path d="M 1000 -80 C 1080 20 970 130 1050 230 C 1130 330 1020 390 1100 490 C 1170 580 1300 540 1380 430 C 1440 340 1420 150 1440 50 L 1440 -80 Z" fill="#2563eb" opacity="0.3" filter="url(#blur1)"/>
  <path d="M 1100 -60 Q 1200 100 1150 250 Q 1100 400 1200 500 Q 1300 590 1440 520 L 1440 -60 Z" fill="#60a5fa" opacity="0.2"/>
  <!-- Overlay gradient for text readability -->
  <linearGradient id="overlay" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#0f172a" stop-opacity="0.92"/>
    <stop offset="55%" stop-color="#0f172a" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#0f172a" stop-opacity="0.1"/>
  </linearGradient>
  <rect width="1440" height="600" fill="url(#overlay)"/>
  <!-- Subtle grid / dot pattern -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#93c5fd" opacity="0.18"/>
  </pattern>
  <rect width="1440" height="600" fill="url(#dots)"/>
</svg>
